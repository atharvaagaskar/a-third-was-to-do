<!doctype html>
<html><head><meta charset="utf-8"><title>A Third Was To Do</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="style.css"></head>
<body>
<header>
  <nav>
    <button class="tab on" data-tab="cal">Calendar</button>
    <button class="tab" data-tab="todo">To-do</button>
  </nav>
  <button id="gear" title="Connect Google Calendar">Link</button>
</header>

<main id="cal">
  <div id="calhead"><span id="calday"></span><span id="calwin">next 5 hours</span></div>
  <div id="allday"></div>
  <div id="grid"></div>
  <div id="calmsg"></div>
</main>

<main id="todo" hidden>
  <form id="add"><input id="new" placeholder="Add a to-do" autocomplete="off"><button>+</button></form>
  <ol id="list"></ol>
  <footer><span id="count"></span><button id="clear">Clear done</button></footer>
</main>

<div id="setup" hidden>
  <h2>Connect Google Calendar</h2>
  <p>In Google Calendar open <b>Settings</b>, pick your calendar, then copy <b>Secret address in iCal format</b> and paste it here.</p>
  <input id="url" placeholder="https://calendar.google.com/calendar/ical/.../basic.ics" autocomplete="off">
  <div class="row"><button id="save">Save</button><button id="cancel" class="ghost">Cancel</button></div>
</div>
<script src="app.js"></script>
</body></html>
